name: 테스트

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # node --test 는 파일을 하나도 못 찾아도 exit 0 이다. 그래서 "전부 통과" 와
      # "아무것도 실행 안 함" 이 똑같이 초록불로 보인다. T03 에서 겪은 일이라
      # 통과 개수를 직접 세서 0 이면 실패로 만든다.
      #
      # 개수는 TAP 리포터의 요약줄에서 읽는다. 기본 리포터는 통계줄이 유니코드
      # 기호로 시작해서 grep 패턴이 환경에 따라 빗나간다.
      - name: 테스트
        run: |
          set -euo pipefail
          npm run test:tap | tee test.tap
          passed=$(sed -n 's/^# pass \([0-9]*\)$/\1/p' test.tap)
          failed=$(sed -n 's/^# fail \([0-9]*\)$/\1/p' test.tap)
          echo "통과 ${passed:-0}건 · 실패 ${failed:-0}건"
          if [ -z "${passed:-}" ] || [ -z "${failed:-}" ]; then
            echo "::error::테스트 요약을 읽지 못했다. 러너가 결과를 내지 않았다는 뜻이다."
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::실패한 테스트 ${failed}건"
            exit 1
          fi
          if [ "$passed" -lt 1 ]; then
            echo "::error::통과한 테스트가 0건이다. 테스트가 실행되지 않았다는 뜻이다."
            exit 1
          fi

      # 제출 조건 판정표도 CI 가 돌린다.
      #
      # 결함 25번이 이걸 시켰다. `dates.length === 2` 라고 쓴 자가 8/28 에는 맞았고
      # 8/29 에 기록이 하루 더 쌓이자 거짓이 됐다 — **요구를 넘어서면 통과를 멈추는
      # 검사**였다. 아무도 안 돌리면 이런 것은 조용히 썩는다. 이 저장소는 매일 봇이
      # 자료를 커밋하므로 자료는 계속 자라고, 자랄 때마다 이 표가 다시 위험해진다.
      #
      # 네트워크를 쓰는 `--online` 은 여기서 돌리지 않는다. Steam 과 공개 주소가
      # 잠깐 흔들린 것을 우리 코드의 실패로 만들면 빨간불의 뜻이 흐려진다.
      # 무인증 접근 확인은 제출 전에 손으로 한 번 돌린다.
      #
      # 위 테스트 단계와 같은 이유로 개수를 직접 센다. 판정 줄이 하나도 안 나와도
      # FAIL 은 0 이라 그냥 통과하기 때문이다 — `아무것도 안 함` 과 `전부 통과` 를
      # 같은 초록불로 만들지 않는다.
      - name: 제출 조건 판정
        run: |
          set -euo pipefail
          npm run audit:t04 | tee audit.md
          summary=$(grep -E '^READY [0-9]+ · WAIT [0-9]+ · CHECK [0-9]+ · FAIL [0-9]+$' audit.md || true)
          if [ -z "$summary" ]; then
            echo "::error::판정 요약줄을 읽지 못했다. 판정표가 나오지 않았다는 뜻이다."
            exit 1
          fi
          rows=$(grep -c '^| T04-C' audit.md || true)
          echo "$summary · 판정 줄 ${rows}건"
          if [ "${rows:-0}" -lt 1 ]; then
            echo "::error::판정된 조건이 0건이다. 조건 목록을 못 읽었다는 뜻이다."
            exit 1
          fi
          fail=$(sed -n 's/.*FAIL \([0-9]*\)$/\1/p' <<<"$summary")
          if [ "${fail:-1}" -ne 0 ]; then
            echo "::error::판정 실패 ${fail}건"
            exit 1
          fi
