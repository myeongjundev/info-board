name: 하루 한 번 기록

on:
  schedule:
    # 매일 10:10 KST 에 재는 것이 약속이다. 그런데 **예약을 한 번만 걸면 그날이
    # 통째로 빈다.** 실측했다 — 시간당 예약(`27 * * * *`)이 29시간 동안 28번
    # 와야 하는데 4번 왔고, 그 4번도 9~58분 늦었다. 공개 저장소의 예약은 우선순위가
    # 낮아 부하 때 늦거나 아예 버려진다.
    #
    # 하루 한 번짜리에 이 확률을 걸면 대부분의 날이 빈다. 실제로 8/27 예약은
    # 11:08 UTC, 8/28 은 12:41 UTC 에 왔고 8/29 은 안 왔다. 그래서 세 날의 기록이
    # 전부 사람이 손으로 돌린 것이고, 그 탓에 잰 시각이 09:59 → 10:39 → 12:00 으로
    # 흘렀다.
    #
    # **약속한 시각 근처에 여러 번 건다.** 하나만 도착하면 된다. 중복은 이미 막혀
    # 있다 — 그날 기록이 다 있으면 collect.mjs 가 외부 호출 전에 종료한다.
    # 예정 시각(10:10)은 그대로다. 재는 시각을 옮긴 것이 아니라 도착 확률을 높인 것이다.
    - cron: '10 1 * * *'   # 10:10 KST
    - cron: '20 1 * * *'   # 10:20 KST
    - cron: '30 1 * * *'   # 10:30 KST
    - cron: '40 1 * * *'   # 10:40 KST
  # 날짜 입력을 받지 않는다.
  #
  # 앞선 소재(하루치 확정 집계)에서는 빈 날을 나중에 메울 수 있어서 `메울 날짜`
  # 입력이 있었다. 동시접속자는 그럴 수 없다 — 어제 10:10 에 몇 명이었는지는
  # 그때 재지 않았으면 영영 모르고, 지금 재서 어제 칸에 넣으면 측정이 아니라
  # 조작이다. 입력칸을 남겨 두면 할 수 있는 일처럼 보이므로 아예 없앤다.
  workflow_dispatch:

permissions:
  contents: write

# 겹쳐 돌면 같은 파일을 두 번 커밋하려다 충돌한다. 하나씩 돌린다.
#
# cancel-in-progress 를 true 로 둔다. false 였을 때, 2026-08-26 에 걸어 둔 실행이
# 잡도 못 만든 채 queued 로 멈춰서 그룹을 붙잡았고, 뒤이은 예정 실행이 그 뒤에
# 계속 줄을 섰다. 하루 한 번짜리 작업에서 앞엣것을 지키려다 이후 전부를 잃는 것은
# 남는 장사가 아니다. upsert 가 멱등이라 중간에 끊겨도 기록이 상하지 않는다.
#
# 그룹 이름에 -v2 를 붙인 이유. 2026-08-26 의 멈춘 실행은 잡이 배정된 적이 없어
# 취소 자체가 먹지 않는다 (UI 가 "Failed to cancel workflow" 를 낸다). 붙잡을
# 프로세스가 없기 때문이다. 그 실행은 `collect` 그룹을 영원히 물고 있으므로,
# 같은 이름을 쓰는 한 새 실행이 계속 그 뒤에 줄을 선다. 이름을 바꾸면 빈 그룹으로
# 옮겨 가 그 실행과 무관해진다 — 취소가 되든 말든 상관없어진다.
concurrency:
  group: collect-v2
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # 이 출처는 인증 키를 요구하지 않는다. 저장소에도 워크플로에도 비밀값이 없다.
      - name: 값 재기
        run: node scripts/collect.mjs

      # 가격은 순간 동시접속자와 별개 스냅샷이다. 사용자가 비공식 Store API를
      # 임시 허용했고, 제출 전 유지 여부를 다시 검토한다 (CLAUDE.md 5-1).
      - name: 한국 할인 확인
        run: node scripts/collect-discounts.mjs

      - name: Steam 인기 Top 100 할인 확인
        run: node scripts/collect-popular-discounts.mjs

      - name: 바뀐 게 있을 때만 커밋
        run: |
          set -euo pipefail
          if git diff --quiet -- data/records.json data/discounts.json data/popular-discounts.json; then
            echo "기록이 그대로다. 커밋하지 않는다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/records.json data/discounts.json data/popular-discounts.json
          git commit -m "data: refresh daily snapshots $(node -e "
            const j = require('./data/records.json');
            const hero = j.source.heroAppid;
            const r = j.records.filter(x => x.appid === hero).at(-1);
            const n = new Set(j.records.map(x => x.date)).size;
            process.stdout.write(\`\${r.date} — \${r.value.toLocaleString()} \${r.unit} (총 \${n}일치)\`);
          ")"
          # 배포 워크플로와 겹쳐 원격이 앞서 있을 수 있다. 되감아 올린다.
          # 여기서 그냥 실패하면 그날 기록을 통째로 잃고, 순간값은 다시 잴 수 없다.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push 실패 — 원격을 당겨 되감고 다시 시도한다 ($i/3)"
            git pull --rebase origin main
          done
          echo "::error::세 번 시도했으나 push 하지 못했다"
          exit 1
